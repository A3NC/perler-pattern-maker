<!-- D26's cursor (M11): the pixel arrow, one unit per art pixel, drawn at 2 CSS px
     per art pixel. B outline #052048, W fill white, S shading #edf3f8.
     Hotspot is the tip, art pixel (0, 0): `1 1` in CSS px.
     B...........
     BB..........
     BWB.........
     BWWB........
     BWWSB.......
     BWWWSB......
     BWWWWSB.....
     BWWWWWSB....
     BWWWWWWSB...
     BWWWWWWWSB..
     BWWWWSBBBBB.
     BWSBWSB.....
     BSBBWSB.....
     BB..BWSB....
     B...BWSB....
     .....BB.....
     The tail steps one column every two rows, evenly: an uneven step
     (1, 2, 1 rows) reads as a curve rather than a straight diagonal.
     Each <rect> is one horizontal run of one colour. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 16" width="24" height="32" shape-rendering="crispEdges">
    <g fill="#052048"> <!-- outline -->
        <rect x="0" y="0" width="1" height="1"/>
        <rect x="0" y="1" width="2" height="1"/>
        <rect x="0" y="2" width="1" height="1"/>
        <rect x="2" y="2" width="1" height="1"/>
        <rect x="0" y="3" width="1" height="1"/>
        <rect x="3" y="3" width="1" height="1"/>
        <rect x="0" y="4" width="1" height="1"/>
        <rect x="4" y="4" width="1" height="1"/>
        <rect x="0" y="5" width="1" height="1"/>
        <rect x="5" y="5" width="1" height="1"/>
        <rect x="0" y="6" width="1" height="1"/>
        <rect x="6" y="6" width="1" height="1"/>
        <rect x="0" y="7" width="1" height="1"/>
        <rect x="7" y="7" width="1" height="1"/>
        <rect x="0" y="8" width="1" height="1"/>
        <rect x="8" y="8" width="1" height="1"/>
        <rect x="0" y="9" width="1" height="1"/>
        <rect x="9" y="9" width="1" height="1"/>
        <rect x="0" y="10" width="1" height="1"/>
        <rect x="6" y="10" width="5" height="1"/>
        <rect x="0" y="11" width="1" height="1"/>
        <rect x="3" y="11" width="1" height="1"/>
        <rect x="6" y="11" width="1" height="1"/>
        <rect x="0" y="12" width="1" height="1"/>
        <rect x="2" y="12" width="2" height="1"/>
        <rect x="6" y="12" width="1" height="1"/>
        <rect x="0" y="13" width="2" height="1"/>
        <rect x="4" y="13" width="1" height="1"/>
        <rect x="7" y="13" width="1" height="1"/>
        <rect x="0" y="14" width="1" height="1"/>
        <rect x="4" y="14" width="1" height="1"/>
        <rect x="7" y="14" width="1" height="1"/>
        <rect x="5" y="15" width="2" height="1"/>
    </g>
    <g fill="#FFFFFF"> <!-- fill -->
        <rect x="1" y="2" width="1" height="1"/>
        <rect x="1" y="3" width="2" height="1"/>
        <rect x="1" y="4" width="2" height="1"/>
        <rect x="1" y="5" width="3" height="1"/>
        <rect x="1" y="6" width="4" height="1"/>
        <rect x="1" y="7" width="5" height="1"/>
        <rect x="1" y="8" width="6" height="1"/>
        <rect x="1" y="9" width="7" height="1"/>
        <rect x="1" y="10" width="4" height="1"/>
        <rect x="1" y="11" width="1" height="1"/>
        <rect x="4" y="11" width="1" height="1"/>
        <rect x="4" y="12" width="1" height="1"/>
        <rect x="5" y="13" width="1" height="1"/>
        <rect x="5" y="14" width="1" height="1"/>
    </g>
    <g fill="#edf3f8"> <!-- shading -->
        <rect x="3" y="4" width="1" height="1"/>
        <rect x="4" y="5" width="1" height="1"/>
        <rect x="5" y="6" width="1" height="1"/>
        <rect x="6" y="7" width="1" height="1"/>
        <rect x="7" y="8" width="1" height="1"/>
        <rect x="8" y="9" width="1" height="1"/>
        <rect x="5" y="10" width="1" height="1"/>
        <rect x="2" y="11" width="1" height="1"/>
        <rect x="5" y="11" width="1" height="1"/>
        <rect x="1" y="12" width="1" height="1"/>
        <rect x="5" y="12" width="1" height="1"/>
        <rect x="6" y="13" width="1" height="1"/>
        <rect x="6" y="14" width="1" height="1"/>
    </g>
</svg>

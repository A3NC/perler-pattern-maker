<!-- D26's sky (M11): one small pixel cloud, one unit per art pixel.
     Drawn as the grid below; each <rect> is one horizontal run of it.
     .....####.....
     ...########...
     .###########..
     ##############
     ##############
     .############.
     Scaled in CSS (background-size), so the art pixel size is set there. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 6" width="14" height="6" shape-rendering="crispEdges" fill="#FFFFFF">
    <rect x="5" y="0" width="4" height="1"/>
    <rect x="3" y="1" width="8" height="1"/>
    <rect x="1" y="2" width="11" height="1"/>
    <rect x="0" y="3" width="14" height="1"/>
    <rect x="0" y="4" width="14" height="1"/>
    <rect x="1" y="5" width="12" height="1"/>
</svg>

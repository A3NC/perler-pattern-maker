<!-- D26's sky (M11): one large pixel cloud, one unit per art pixel.
     Drawn as the grid below; each <rect> is one horizontal run of it.
     .........####.........
     .......########.......
     ....#############.....
     ...###############.##.
     ..####################
     .#####################
     ######################
     ######################
     .####################.
     Scaled in CSS (background-size), so the art pixel size is set there. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 9" width="22" height="9" shape-rendering="crispEdges" fill="#FFFFFF">
    <rect x="9" y="0" width="4" height="1"/>
    <rect x="7" y="1" width="8" height="1"/>
    <rect x="4" y="2" width="13" height="1"/>
    <rect x="3" y="3" width="15" height="1"/>
    <rect x="19" y="3" width="2" height="1"/>
    <rect x="2" y="4" width="20" height="1"/>
    <rect x="1" y="5" width="21" height="1"/>
    <rect x="0" y="6" width="22" height="1"/>
    <rect x="0" y="7" width="22" height="1"/>
    <rect x="1" y="8" width="20" height="1"/>
</svg>

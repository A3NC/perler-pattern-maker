<!-- D26's cursor (M11): the pointing hand, for clickable controls, one unit per art pixel, drawn at 2 CSS px
     per art pixel. B outline #052048, W fill white, S shading #edf3f8.
     Hotspot: the fingertip, art pixels (5-6, 0): `12 1` in CSS px.
     .....BB.........
     ....BWSB........
     ....BWSB........
     ....BWSB........
     ....BWSBBB......
     ....BWSBWSBB....
     ....BWSBWSBWSBB.
     .BB.BWSBWSBWSBWB
     BWSBBWWWWWWWWWSB
     BWWSBWWWWWWWWWSB
     .BWWWWWWWWWWWWSB
     ..BWWWWWWWWWWWSB
     ...BWWWWWWWWWWSB
     ....BWWWWWWWWSB.
     .....BWWWWWWWSB.
     .....BBBBBBBBB..
     Each <rect> is one horizontal run of one colour. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
    <g fill="#052048"> <!-- outline -->
        <rect x="5" y="0" width="2" height="1"/>
